# Render Blueprint — connect repo and Render reads this automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: devtracker-pro
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
