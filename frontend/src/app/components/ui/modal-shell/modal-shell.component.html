@if (open()) {
  <div
    class="modal-backdrop fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in"
    (click)="onBackdrop()"
    [attr.data-locale]="locale.locale()"
  >
    <div
      class="modal-panel bg-bg-elevated border border-border rounded-xl w-full shadow-modal animate-scale-in flex flex-col max-h-[90vh] overflow-hidden"
      [class]="panelClass()"
      (click)="$event.stopPropagation()"
    >
      @if (title()) {
        <div class="px-6 py-5 border-b border-border flex items-start justify-between gap-4 shrink-0">
          <div class="min-w-0">
            <h2 class="text-lg font-bold text-white tracking-tight">{{ title() }}</h2>
            @if (subtitle()) {
              <p class="text-xs text-text-muted mt-1">{{ subtitle() }}</p>
            }
          </div>
          <button
            type="button"
            class="text-text-muted hover:text-white transition-colors shrink-0"
            (click)="closed.emit()"
            [attr.aria-label]="'common.close' | translate"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      }

      <div class="flex-1 overflow-y-auto">
        <ng-content />
      </div>

      <ng-content select="[modal-footer]" />
    </div>
  </div>
}
