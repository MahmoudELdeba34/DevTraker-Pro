@if (mode() === 'select') {
  <div class="flex flex-col gap-2" [attr.data-locale]="locale.locale()">
    @if (label()) {
      <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ labelText() }}</label>
    }
    <select
      class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent focus:shadow-glow appearance-none"
      [disabled]="disabled()"
      [ngModel]="value() || ''"
      (ngModelChange)="valueChange.emit($event || null)"
    >
      <option value="">{{ placeholderText() }}</option>
      @for (member of members(); track member._id) {
        <option [value]="member._id">{{ member.name }}</option>
      }
    </select>
  </div>
} @else {
  <div class="relative" [attr.data-locale]="locale.locale()">
    @if (label()) {
      <span class="text-xs text-text-muted block mb-1">{{ labelText() }}</span>
    }
    <button
      type="button"
      class="text-xs font-semibold flex items-center gap-2 px-2.5 py-1.5 rounded-md border transition-colors min-w-0 max-w-full"
      [ngClass]="selectedMember() ? 'bg-accent/10 text-white border-accent/30 hover:bg-accent/20' : 'bg-bg-base text-text-secondary border-border hover:border-accent/40 hover:text-white'"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      @if (selectedMember(); as m) {
        <span class="w-6 h-6 rounded-full bg-accent/25 flex items-center justify-center text-[9px] font-bold text-accent shrink-0">
          {{ initials(m.name) }}
        </span>
        <span class="truncate">{{ m.name }}</span>
      } @else {
        <span>{{ placeholderText() }}</span>
      }
      <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" class="ml-auto shrink-0 opacity-60"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>

    @if (open()) {
      <div class="absolute top-full left-0 mt-1 w-64 bg-bg-elevated border border-border rounded-xl shadow-xl overflow-hidden z-[60]">
        @if (searchable()) {
          <div class="p-2 border-b border-border">
            <input
              type="text"
              [ngModel]="search()"
              (ngModelChange)="search.set($event)"
              [placeholder]="'common.searchMembers' | translate"
              class="w-full bg-bg-base border border-border text-white text-xs rounded-lg px-3 py-2 outline-none focus:border-accent"
              (click)="$event.stopPropagation()"
            />
          </div>
        }
        <div class="flex flex-col max-h-52 overflow-y-auto py-1">
          <button type="button" class="flex items-center gap-2 px-3 py-2 text-left hover:bg-bg-hover text-text-secondary transition-colors text-xs" (click)="pick(null)">
            {{ placeholderText() }}
          </button>
          @for (member of filteredMembers(); track member._id) {
            <button
              type="button"
              class="flex items-center gap-2.5 px-3 py-2 text-left hover:bg-bg-hover transition-colors w-full"
              [ngClass]="{ 'bg-accent-subtle': value() === member._id }"
              (click)="pick(member._id)"
            >
              <span class="w-7 h-7 rounded-full bg-accent/20 flex items-center justify-center text-[9px] font-bold text-accent shrink-0">
                {{ initials(member.name) }}
              </span>
              <span class="flex-1 min-w-0">
                <span class="block text-xs font-semibold text-white truncate">{{ member.name }}</span>
                <span class="block text-[10px] text-text-muted truncate">{{ member.email }}</span>
              </span>
            </button>
          }
        </div>
      </div>
    }
  </div>
}
