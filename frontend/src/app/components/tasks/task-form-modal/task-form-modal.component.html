<app-modal-shell [open]="open()" [title]="'taskForm.new' | translate" maxWidth="md" (closed)="cancelled.emit()">
  <form [formGroup]="form()" (ngSubmit)="submitForm.emit()" class="p-6 flex flex-col gap-5" [attr.data-locale]="locale.locale()">
    <div class="flex flex-col gap-2">
      <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'taskForm.title' | translate }} <span class="text-danger">{{ 'common.required' | translate }}</span></label>
      <input
        type="text"
        formControlName="title"
        [placeholder]="'taskForm.titlePlaceholder' | translate"
        class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent focus:shadow-glow placeholder:text-text-muted/50"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="flex flex-col gap-2">
        <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'taskForm.priority' | translate }}</label>
        <select formControlName="priority" class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent appearance-none">
          <option value="low">{{ 'task.priority.low' | translate }}</option>
          <option value="medium">{{ 'task.priority.medium' | translate }}</option>
          <option value="high">{{ 'task.priority.high' | translate }}</option>
        </select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'taskForm.assignee' | translate }}</label>
        <select formControlName="assignedTo" class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent appearance-none">
          <option value="">{{ 'common.unassigned' | translate }}</option>
          @for (member of members(); track member._id) {
            <option [value]="member._id">{{ member.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'taskForm.deadline' | translate }}</label>
      <input type="date" formControlName="deadline" class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent color-scheme-dark" />
    </div>
  </form>

  <div modal-footer class="px-6 py-4 border-t border-border flex items-center justify-end gap-3 shrink-0">
    <button type="button" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-secondary hover:text-white hover:bg-bg-hover transition-colors" (click)="cancelled.emit()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      type="button"
      class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-accent hover:bg-accent-hover transition-colors disabled:opacity-50"
      [disabled]="saving() || form().invalid"
      (click)="submitForm.emit()"
    >
      {{ submitLabel() }}
    </button>
  </div>
</app-modal-shell>
