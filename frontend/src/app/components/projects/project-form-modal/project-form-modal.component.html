<app-modal-shell
  [open]="open()"
  [title]="modalTitle()"
  [subtitle]="modalSubtitle()"
  maxWidth="lg"
  (closed)="cancelled.emit()"
>
  <form [formGroup]="form()" (ngSubmit)="submitForm.emit()" class="p-6 flex flex-col gap-5" [attr.data-locale]="locale.locale()">
    <div class="flex flex-col gap-2">
      <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'projectForm.title' | translate }} <span class="text-danger">{{ 'common.required' | translate }}</span></label>
      <input
        type="text"
        formControlName="title"
        [placeholder]="'projectForm.projectNamePlaceholder' | translate"
        class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent focus:shadow-glow placeholder:text-text-muted/50"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'projectForm.description' | translate }}</label>
      <textarea
        formControlName="description"
        rows="3"
        [placeholder]="'projectForm.optionalDescription' | translate"
        class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent resize-none placeholder:text-text-muted/50"
      ></textarea>
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'projectForm.deadline' | translate }}</label>
      <input
        type="date"
        formControlName="deadline"
        class="w-full bg-bg-base border border-border text-white text-sm rounded-lg px-4 py-2.5 outline-none transition-all focus:border-accent color-scheme-dark"
      />
    </div>

    @if (members().length) {
      <div class="flex flex-col gap-2">
        <label class="text-[11px] font-bold text-text-secondary uppercase tracking-wider">{{ 'projectForm.members' | translate }}</label>
        <p class="text-[11px] text-text-muted">{{ 'projectForm.membersHint' | translate }}</p>
        <div class="flex flex-wrap gap-2 max-h-36 overflow-y-auto hide-scrollbar p-1">
          @for (m of members(); track m._id) {
            <button
              type="button"
              class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs font-semibold transition-colors"
              [ngClass]="isSelected(m._id) ? 'bg-accent/15 text-white border-accent/40' : 'bg-bg-base text-text-secondary border-border hover:border-accent/30'"
              (click)="toggleMember.emit(m._id)"
            >
              <span class="w-5 h-5 rounded-full bg-accent/20 text-accent flex items-center justify-center text-[8px] font-bold">
                {{ initials(m.name) }}
              </span>
              {{ m.name }}
            </button>
          }
        </div>
      </div>
    }
  </form>

  <div modal-footer class="px-6 py-4 border-t border-border flex items-center justify-end gap-3 shrink-0">
    <button type="button" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-secondary hover:text-white hover:bg-bg-hover transition-colors" (click)="cancelled.emit()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      type="button"
      class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-accent hover:bg-accent-hover transition-colors shadow-glow-soft disabled:opacity-50"
      [disabled]="saving() || form().invalid"
      (click)="submitForm.emit()"
    >
      {{ submitLabel() }}
    </button>
  </div>
</app-modal-shell>
